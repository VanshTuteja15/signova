; SIGNOVA hand firmware (ESP32, Arduino framework)
;
;   pio run -e esp32dev               build for the default hand (PCA9685)
;   pio run -e esp32dev -t upload     flash the ESP32 (see docs/SETUP_WINDOWS.md)
;   pio run -e esp32dev_feetech       build for Feetech serial-bus servos (untested on hardware)
;   pio test -e native                run the motion + protocol unit tests on the laptop
;
; Joint names / order live in include/config.h and must match config/hand.yaml.

[platformio]
default_envs = esp32dev

[env]
lib_deps =
    bblanchon/ArduinoJson@^7

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = default
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit PWM Servo Driver Library@^3
build_flags =
    -DDRIVER_PCA9685
    -Wall

[env:esp32dev_feetech]
extends = env:esp32dev
lib_deps =
    ${env.lib_deps}
build_flags =
    -DDRIVER_FEETECH
    -Wall

; Unit tests on the laptop. motion.cpp / protocol.cpp contain no Arduino code.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<driver_pca9685.cpp> -<driver_feetech.cpp>
build_flags =
    -std=gnu++11
    -Wall
