[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signova"
version = "0.1.0"
description = "SIGNOVA: experimental speech -> AI -> ASL handshape -> robotic hand pipeline (research prototype)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SIGNOVA team (SAIT Emerging Trends)" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "pyserial>=3.5",
    "anthropic>=0.70",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.0", "vosk>=0.3.45", "av>=12"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.5", "playwright>=1.44", "websockets>=12"]

[project.scripts]
signova = "signova.cli:main"

[tool.setuptools.packages.find]
include = ["signova*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["firmware", "dashboard", "models", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF100"]
ignore = ["SIM105", "E501"]  # line length is handled by `ruff format`

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: tests that load real speech models",
    "browser: tests that drive a real browser with Playwright",
]
addopts = "-ra"

[tool.coverage.run]
source = ["signova"]
omit = ["signova/speech/*"]
