# SIGNOVA sign library.
#
# Every joint value is normalised: 0.0 = open / neutral, 1.0 = fully closed / rotated.
# Joints missing from a frame's pose fall back to `rest`. No servo angles live here.
#
# ALL POSES ARE DRAFTS. They are rough approximations made for testing the pipeline and
# must be checked by a fluent ASL signer before anyone relies on them (reference:
# Dr. Bill Vicars' fingerspelling pages at lifeprint.com). Mark a sign as validated in
# Pose Studio, which records the reviewer and date.
#
# Fields: kind (word | letter | number), tier (1 must-have, 2 should-have, 3 stretch),
# english (phrases the rule-based gloss matches), requires (joints the hand must have),
# frames (one or more poses with optional hold_ms / move_ms).
#
# Note: 4 and B share a handshape on this hand because there is no finger-spread joint.
# Many tier-2 signs are APPROXIMATIONS: real ASL uses arm movement, body location or two hands,
# which this one-handed robot can't do. Their notes say what the real sign looks like.

version: 1

rest: {thumb: 0.15, thumb_rot: 0.2, index: 0.15, middle: 0.15, ring: 0.18, pinky: 0.2, wrist: 0.5, spread_index_middle: 0.0, wrist_flex: 0.5}

signs:
  # ---------------------------------------------------------------- numbers (tier 1)
  "1":
    kind: number
    tier: 1
    english: ["one", "1"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Index up, thumb holds the other fingers down"
    frames:
      - pose: {thumb: 0.7, thumb_rot: 0.9, index: 0.0, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.5}
  "2":
    kind: number
    tier: 1
    english: ["two", "2"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Index and middle up"
    frames:
      - pose: {thumb: 0.7, thumb_rot: 0.9, index: 0.0, middle: 0.0, ring: 1.0, pinky: 1.0, wrist: 0.5}
  "3":
    kind: number
    tier: 1
    english: ["three", "3"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "ASL 3 uses thumb, index and middle"
    frames:
      - pose: {thumb: 0.0, thumb_rot: 0.0, index: 0.0, middle: 0.0, ring: 1.0, pinky: 1.0, wrist: 0.5}
  "4":
    kind: number
    tier: 1
    english: ["four", "4"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Four fingers up, thumb across the palm. Same handshape as B here (no finger spread)"
    frames:
      - pose: {thumb: 0.8, thumb_rot: 0.95, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.0, wrist: 0.5}
  "5":
    kind: number
    tier: 1
    english: ["five", "5"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Open hand"
    frames:
      - pose: {thumb: 0.0, thumb_rot: 0.0, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.0, wrist: 0.5}

  # ------------------------------------------------------------------ words (tier 1)
  ILY:
    kind: word
    tier: 1
    english: ["i love you", "love you", "ily"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Thumb, index, pinky extended"
    frames:
      - pose: {thumb: 0.0, thumb_rot: 0.0, index: 0.0, middle: 1.0, ring: 1.0, pinky: 0.0, wrist: 0.5}
        hold_ms: 800
  HELLO:
    kind: word
    tier: 2
    english: ["hello", "hi", "hey"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky, wrist]
    validated_by_signer: false
    notes: "APPROXIMATION. Real ASL HELLO is a flat-hand salute moving out from the forehead (arm movement). This hand has no arm, so it shows the flat B handshape with an outward wrist turn."
    frames:
      - pose: {thumb: 0.8, thumb_rot: 0.95, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.0, wrist: 0.5}
        hold_ms: 250
      - pose: {thumb: 0.8, thumb_rot: 0.95, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.0, wrist: 0.85}
        hold_ms: 600

  # ---------------------------------------------------------------- letters (tier 1)
  A:
    kind: letter
    tier: 1
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Fist, thumb along the side of the index"
    frames:
      - pose: {thumb: 0.05, thumb_rot: 0.1, index: 1.0, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.5}
  B:
    kind: letter
    tier: 1
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Flat hand, thumb across the palm. Same handshape as 4 here"
    frames:
      - pose: {thumb: 0.8, thumb_rot: 0.95, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.0, wrist: 0.5}
  C:
    kind: letter
    tier: 1
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Curved C shape"
    frames:
      - pose: {thumb: 0.35, thumb_rot: 0.45, index: 0.45, middle: 0.45, ring: 0.45, pinky: 0.45, wrist: 0.5}
  D:
    kind: letter
    tier: 1
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Index up, other fingers curl to touch the thumb"
    frames:
      - pose: {thumb: 0.6, thumb_rot: 0.85, index: 0.0, middle: 0.72, ring: 0.75, pinky: 0.78, wrist: 0.5}
  E:
    kind: letter
    tier: 1
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Fingertips curled down onto the tucked thumb"
    frames:
      - pose: {thumb: 0.85, thumb_rot: 1.0, index: 0.8, middle: 0.8, ring: 0.8, pinky: 0.8, wrist: 0.5}
  F:
    kind: letter
    tier: 1
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Index and thumb touch, other three fingers up"
    frames:
      - pose: {thumb: 0.55, thumb_rot: 0.75, index: 0.72, middle: 0.0, ring: 0.0, pinky: 0.0, wrist: 0.5}
  I:
    kind: letter
    tier: 1
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Pinky up, fist"
    frames:
      - pose: {thumb: 0.7, thumb_rot: 0.95, index: 1.0, middle: 1.0, ring: 1.0, pinky: 0.0, wrist: 0.5}
  L:
    kind: letter
    tier: 1
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Thumb and index make an L"
    frames:
      - pose: {thumb: 0.0, thumb_rot: 0.0, index: 0.0, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.5}
  O:
    kind: letter
    tier: 1
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "All fingertips meet the thumb"
    frames:
      - pose: {thumb: 0.5, thumb_rot: 0.7, index: 0.62, middle: 0.62, ring: 0.62, pinky: 0.62, wrist: 0.5}
  S:
    kind: letter
    tier: 1
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Fist, thumb across the front of the fingers"
    frames:
      - pose: {thumb: 0.75, thumb_rot: 1.0, index: 1.0, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.5}
  W:
    kind: letter
    tier: 1
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Index, middle, ring up; thumb holds the pinky"
    frames:
      - pose: {thumb: 0.7, thumb_rot: 0.95, index: 0.0, middle: 0.0, ring: 0.0, pinky: 1.0, wrist: 0.5}
  Y:
    kind: letter
    tier: 1
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Thumb and pinky out"
    frames:
      - pose: {thumb: 0.0, thumb_rot: 0.0, index: 1.0, middle: 1.0, ring: 1.0, pinky: 0.0, wrist: 0.5}

  # ------------------------------------------------------------------- tier 2 motion
  "NO":
    kind: word
    tier: 2
    english: ["no", "nope", "nah"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Index and middle snap down onto the thumb, twice"
    frames:
      - pose: {thumb: 0.2, thumb_rot: 0.55, index: 0.15, middle: 0.15, ring: 1.0, pinky: 1.0, wrist: 0.5}
        hold_ms: 220
      - pose: {thumb: 0.5, thumb_rot: 0.8, index: 0.55, middle: 0.55, ring: 1.0, pinky: 1.0, wrist: 0.5}
        hold_ms: 220
      - pose: {thumb: 0.2, thumb_rot: 0.55, index: 0.15, middle: 0.15, ring: 1.0, pinky: 1.0, wrist: 0.5}
        hold_ms: 220
      - pose: {thumb: 0.5, thumb_rot: 0.8, index: 0.55, middle: 0.55, ring: 1.0, pinky: 1.0, wrist: 0.5}
        hold_ms: 220

  # ------------------------------------------------------- tier 3 (needs extra joints)
  J:
    kind: letter
    tier: 3
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky, wrist]
    validated_by_signer: false
    notes: "I handshape, then the wrist turns to trace a J"
    frames:
      - pose: {thumb: 0.7, thumb_rot: 0.95, index: 1.0, middle: 1.0, ring: 1.0, pinky: 0.0, wrist: 0.5}
        hold_ms: 300
      - pose: {thumb: 0.7, thumb_rot: 0.95, index: 1.0, middle: 1.0, ring: 1.0, pinky: 0.0, wrist: 1.0}
        hold_ms: 300
  U:
    kind: letter
    tier: 2
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Index and middle up and together. On a hand without a spread joint, U and V look the same"
    frames:
      - pose: {thumb: 0.7, thumb_rot: 0.9, index: 0.0, middle: 0.0, ring: 1.0, pinky: 1.0, wrist: 0.5, spread_index_middle: 0.0}
  V:
    kind: letter
    tier: 2
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "APPROXIMATION. Index and middle up and spread apart. Uses the spread joint when the hand has one; otherwise it looks the same as U"
    frames:
      - pose: {thumb: 0.7, thumb_rot: 0.9, index: 0.0, middle: 0.0, ring: 1.0, pinky: 1.0, wrist: 0.5, spread_index_middle: 1.0}

  # ------------------------------------------- letters completing A-Z (approximations)
  G:
    kind: letter
    tier: 2
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky, wrist]
    validated_by_signer: false
    notes: "APPROXIMATION. Real G: index and thumb point sideways. Shown with the hand turned edge-on."
    frames:
      - pose: {thumb: 0.2, thumb_rot: 0.2, index: 0.0, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.9}
  H:
    kind: letter
    tier: 2
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky, wrist]
    validated_by_signer: false
    notes: "APPROXIMATION. Real H: index and middle point sideways. Shown with the hand turned edge-on."
    frames:
      - pose: {thumb: 0.7, thumb_rot: 0.9, index: 0.0, middle: 0.0, ring: 1.0, pinky: 1.0, wrist: 0.9}
  K:
    kind: letter
    tier: 2
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "APPROXIMATION. Index and middle up, thumb up between them. Without a spread joint it is close to U."
    frames:
      - pose: {thumb: 0.3, thumb_rot: 0.5, index: 0.0, middle: 0.0, ring: 1.0, pinky: 1.0, wrist: 0.5, spread_index_middle: 0.6}
  M:
    kind: letter
    tier: 2
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "APPROXIMATION. Thumb tucked under three folded fingers."
    frames:
      - pose: {thumb: 0.9, thumb_rot: 1.0, index: 0.8, middle: 0.8, ring: 0.8, pinky: 1.0, wrist: 0.5}
  "N":
    kind: letter
    tier: 2
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "APPROXIMATION. Thumb tucked under two folded fingers. Differs from M only in the ring finger."
    frames:
      - pose: {thumb: 0.9, thumb_rot: 1.0, index: 0.8, middle: 0.8, ring: 1.0, pinky: 1.0, wrist: 0.5}
  P:
    kind: letter
    tier: 2
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky, wrist]
    validated_by_signer: false
    notes: "APPROXIMATION. Real P is K pointing down (needs wrist bend). Shown as K turned edge-on."
    frames:
      - pose: {thumb: 0.3, thumb_rot: 0.5, index: 0.0, middle: 0.0, ring: 1.0, pinky: 1.0, wrist: 0.85, spread_index_middle: 0.6}
  Q:
    kind: letter
    tier: 2
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky, wrist]
    validated_by_signer: false
    notes: "APPROXIMATION. Real Q is G pointing down (needs wrist bend). Shown as G turned the other way."
    frames:
      - pose: {thumb: 0.15, thumb_rot: 0.3, index: 0.2, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.15}
  R:
    kind: letter
    tier: 2
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky, wrist]
    validated_by_signer: false
    notes: "APPROXIMATION. Real R crosses index and middle. This hand can't cross fingers, so it looks like U."
    frames:
      - pose: {thumb: 0.7, thumb_rot: 0.9, index: 0.0, middle: 0.12, ring: 1.0, pinky: 1.0, wrist: 0.55}
  T:
    kind: letter
    tier: 2
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "APPROXIMATION. Thumb tucked between index and middle in a fist."
    frames:
      - pose: {thumb: 0.6, thumb_rot: 0.7, index: 0.9, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.5}
  X:
    kind: letter
    tier: 2
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "APPROXIMATION. Index hooked, other fingers in a fist."
    frames:
      - pose: {thumb: 0.7, thumb_rot: 0.9, index: 0.5, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.5}
  Z:
    kind: letter
    tier: 2
    english: []
    requires: [thumb, thumb_rot, index, middle, ring, pinky, wrist]
    validated_by_signer: false
    notes: "APPROXIMATION. Index traces a Z in the air. Shown as the index up with the wrist turning back and forth."
    frames:
      - pose: {thumb: 0.7, thumb_rot: 0.9, index: 0.0, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.35}
        hold_ms: 200
      - pose: {thumb: 0.7, thumb_rot: 0.9, index: 0.0, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.65}
        hold_ms: 200
      - pose: {thumb: 0.7, thumb_rot: 0.9, index: 0.0, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.35}
        hold_ms: 200

  # ------------------------------------------------------------ numbers 0 and 6-10
  "0":
    kind: number
    tier: 2
    english: ["zero", "0"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Same O shape as the letter O."
    frames:
      - pose: {thumb: 0.5, thumb_rot: 0.7, index: 0.62, middle: 0.62, ring: 0.62, pinky: 0.62, wrist: 0.5}
  "6":
    kind: number
    tier: 2
    english: ["six", "6"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Thumb touches the pinky, other three fingers up."
    frames:
      - pose: {thumb: 0.6, thumb_rot: 0.85, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.7, wrist: 0.5}
  "7":
    kind: number
    tier: 2
    english: ["seven", "7"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Thumb touches the ring finger."
    frames:
      - pose: {thumb: 0.6, thumb_rot: 0.8, index: 0.0, middle: 0.0, ring: 0.7, pinky: 0.0, wrist: 0.5}
  "8":
    kind: number
    tier: 2
    english: ["eight", "8"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Thumb touches the middle finger."
    frames:
      - pose: {thumb: 0.55, thumb_rot: 0.75, index: 0.0, middle: 0.7, ring: 0.0, pinky: 0.0, wrist: 0.5}
  "9":
    kind: number
    tier: 2
    english: ["nine", "9"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Thumb touches the index (same handshape as F)."
    frames:
      - pose: {thumb: 0.55, thumb_rot: 0.75, index: 0.72, middle: 0.0, ring: 0.0, pinky: 0.0, wrist: 0.5}
  "10":
    kind: number
    tier: 2
    english: ["ten", "10"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky, wrist]
    validated_by_signer: false
    notes: "Thumb up in a fist, shaken with a small wrist twist."
    frames:
      - pose: {thumb: 0.05, thumb_rot: 0.1, index: 1.0, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.4}
        hold_ms: 200
      - pose: {thumb: 0.05, thumb_rot: 0.1, index: 1.0, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.6}
        hold_ms: 200
      - pose: {thumb: 0.05, thumb_rot: 0.1, index: 1.0, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.4}
        hold_ms: 200

  # ------------------------------------------------- everyday words (approximations)
  # Most real ASL words use arm movement, location on the body or two hands. These keep the
  # handshape and replace the movement with finger or wrist motion. Notes say what the real sign is.
  BYE:
    kind: word
    tier: 2
    english: ["bye", "goodbye", "good bye", "bye bye", "see you", "see you later", "see ya"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky]
    validated_by_signer: false
    notes: "Open hand, fingers fold down and up (a wave). Close to real ASL BYE."
    frames:
      - pose: {thumb: 0.0, thumb_rot: 0.0, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.0, wrist: 0.5}
        hold_ms: 150
      - pose: {thumb: 0.1, thumb_rot: 0.1, index: 0.6, middle: 0.6, ring: 0.6, pinky: 0.6, wrist: 0.5}
        hold_ms: 150
      - pose: {thumb: 0.0, thumb_rot: 0.0, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.0, wrist: 0.5}
        hold_ms: 150
      - pose: {thumb: 0.1, thumb_rot: 0.1, index: 0.6, middle: 0.6, ring: 0.6, pinky: 0.6, wrist: 0.5}
        hold_ms: 150
      - pose: {thumb: 0.0, thumb_rot: 0.0, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.0, wrist: 0.5}
        hold_ms: 250
  THANKS:
    kind: word
    tier: 2
    english: ["thank you", "thanks", "thank you so much", "thank you very much", "thanks a lot", "thank u"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky, wrist]
    validated_by_signer: false
    notes: "APPROXIMATION. Real THANK-YOU: flat hand moves forward from the chin. Shown as a flat hand turning outward."
    frames:
      - pose: {thumb: 0.35, thumb_rot: 0.3, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.0, wrist: 0.5}
        hold_ms: 200
      - pose: {thumb: 0.35, thumb_rot: 0.3, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.0, wrist: 0.85}
        hold_ms: 500
  PLEASE:
    kind: word
    tier: 2
    english: ["please"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky, wrist]
    validated_by_signer: false
    notes: "APPROXIMATION. Real PLEASE: flat hand circles on the chest. Shown as a flat hand rocking at the wrist."
    frames:
      - pose: {thumb: 0.35, thumb_rot: 0.3, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.0, wrist: 0.4}
        hold_ms: 150
      - pose: {thumb: 0.35, thumb_rot: 0.3, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.0, wrist: 0.6}
        hold_ms: 150
      - pose: {thumb: 0.35, thumb_rot: 0.3, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.0, wrist: 0.4}
        hold_ms: 150
      - pose: {thumb: 0.35, thumb_rot: 0.3, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.0, wrist: 0.6}
        hold_ms: 250
  SORRY:
    kind: word
    tier: 2
    english: ["sorry", "i am sorry", "so sorry", "my apologies", "apologies"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky, wrist]
    validated_by_signer: false
    notes: "APPROXIMATION. Real SORRY: A-hand (fist) circles on the chest. Shown as a fist rocking at the wrist."
    frames:
      - pose: {thumb: 0.05, thumb_rot: 0.1, index: 1.0, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.4}
        hold_ms: 150
      - pose: {thumb: 0.05, thumb_rot: 0.1, index: 1.0, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.6}
        hold_ms: 150
      - pose: {thumb: 0.05, thumb_rot: 0.1, index: 1.0, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.4}
        hold_ms: 150
      - pose: {thumb: 0.05, thumb_rot: 0.1, index: 1.0, middle: 1.0, ring: 1.0, pinky: 1.0, wrist: 0.6}
        hold_ms: 250
  "YES":
    kind: word
    tier: 2
    english: ["yes", "yeah", "yep", "yup"]
    requires: [thumb, thumb_rot, index, middle, ring, pinky, wrist]
    validated_by_signer: false
